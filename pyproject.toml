[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "script-inventory"
version = "1.0.0"
description = "Inventory every script a page runs with headless Chromium: party, vendor, size, SRI, libraries, known-vulnerable versions, mixed content, inline scripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marvin Palencia" }]
keywords = ["security", "javascript", "subresource-integrity", "csp", "playwright", "audit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
script-inventory = "script_inventory.cli:main"

[project.urls]
Homepage = "https://github.com/dreadmoreeee/script-inventory"

[tool.setuptools]
packages = ["script_inventory"]

[tool.setuptools.package-data]
script_inventory = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
